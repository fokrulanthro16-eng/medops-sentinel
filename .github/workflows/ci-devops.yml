name: MedOps-Sentinel CI/CD & SRE Reliability Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  verify-and-test:
    name: SRE & Clinical Verification Suite (15/15 Scenarios)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code Quality & Linting
        run: |
          python -m py_compile app.py server.py tests/test_suite.py
          echo "Syntax check passed cleanly."

      - name: Run 15-Scenario Clinical & DevOps Verification Suite
        run: |
          python -m pytest tests/test_suite.py -v --tb=short

      - name: Benchmark Sub-10ms SRE Latency SLA
        run: |
          python -c "
          import time
          from app import sentinel_engine, EvaluationRequest, PatientVitals
          v = PatientVitals(heart_rate=75, spo2=98, systolic_bp=120, diastolic_bp=80, resp_rate=16, temp_c=37)
          req = EvaluationRequest(vitals=v)
          times = []
          for _ in range(100):
              t0 = time.perf_counter()
              resp = sentinel_engine.evaluate(req)
              times.append((time.perf_counter() - t0) * 1000)
          avg_lat = sum(times) / len(times)
          p99_lat = sorted(times)[98]
          print(f'Mean Latency: {avg_lat:.3f} ms | p99 Latency: {p99_lat:.3f} ms (Target < 10ms)')
          assert avg_lat < 10.0, 'SLA Violated!'
          "

  docker-build-validation:
    name: Docker Image Build & Healthcheck Validation
    runs-on: ubuntu-latest
    needs: verify-and-test

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: medops-sentinel:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
